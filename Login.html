<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Gorkha Secondary School</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">

    <header class="navbar">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">Gorkha Secondary School</span>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#about">About Us</a>
        <a href="Gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="staff.html">Staff</a>
        <a href="Form.html">Admission Form</a>
        <a href="Login.html" class="active">Login</a>
      </nav>
    </header>

    <section class="login-section">
      <div class="login-box">
        <h2>Welcome Back</h2>
        <p>Please login to continue</p>

        <form>
          <input type="text" placeholder="Username" required>
          <input type="password" placeholder="Password" required>

          <button type="submit">Login</button>
        </form>

        <p style="margin-top:20px; font-size:15px; color:#718096;">
          Don't have an account?
          <a href="register.html" style="#e63946; text-decoration:none; font-weight:600;">
            Create Account
          </a>
        </p>

      </div>
    </section>

  </div>
</body>
</html>
